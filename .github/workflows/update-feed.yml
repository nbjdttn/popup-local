name: Update feed

# Runs the Claude agent, saves results to site/data/feed.json, publishes the
# page to GitHub Pages, and opens an issue when there are stand-out new finds.

on:
  schedule:
    # Twice a day, around 7am and 5pm UK time (times are UTC).
    - cron: '48 6,16 * * *'
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
    inputs:
      search:
        description: 'Run the agent (untick to only republish the page)'
        type: boolean
        default: true
  # Republish the page when the site code changes.
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RUN_AGENT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.search) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: env.RUN_AGENT == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.RUN_AGENT == 'true'
        run: npm ci

      - name: Run the agent
        if: env.RUN_AGENT == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: npm run update

      - name: Save results to the repo
        if: env.RUN_AGENT == 'true'
        run: |
          git config user.name "popup-local-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Manchester feed"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Notify about stand-out new finds
        if: env.RUN_AGENT == 'true' && hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "New in Manchester: $(date -u +'%d %b %Y %H:%M') UTC" \
            --body-file notify.md

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
