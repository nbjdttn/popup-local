name: Update feed

# Runs the Claude agent, saves results to site/data/feed.json, sends a WeChat
# message (Server酱) about stand-out new finds, and publishes the page.

on:
  schedule:
    # Once a day, around 8am UK time (07:49 UTC; 08:49 during British Summer Time).
    - cron: '49 7 * * *'
  # "Run workflow" button on the Actions tab.
  workflow_dispatch:
    inputs:
      search:
        description: 'Run the agent (untick to only republish the page)'
        type: boolean
        default: true
      test_wechat:
        description: 'Send a WeChat test message'
        type: boolean
        default: false
  # Republish the page when the site code changes.
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      RUN_AGENT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.search) }}
      PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: env.RUN_AGENT == 'true'
        run: npm ci

      - name: Send a WeChat test message
        if: github.event_name == 'workflow_dispatch' && inputs.test_wechat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: node agent/wechat.mjs --test

      - name: Run the agent
        if: env.RUN_AGENT == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: npm run update

      - name: Save results to the repo
        if: env.RUN_AGENT == 'true'
        run: |
          git config user.name "popup-local-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/feed.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Manchester feed"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
